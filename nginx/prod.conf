upstream flask_app {
    server web:8000;
}

upstream django_app {
    server admin_django:8080;
}

# Redireccionar HTTP a HTTPS en ambos dominios.
server {
    listen 80;
    server_name carta.3-90-114-237.sslip.io admin.3-90-114-237.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name carta.3-90-114-237.sslip.io;
    server_tokens off;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/cartadragonpai.chickenkiller.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cartadragonpai.chickenkiller.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

server {
    listen 443 ssl;
    server_name admin.3-90-114-237.sslip.io;
    server_tokens off;
    client_max_body_size 10M;

    # Se emitirá un certificado SAN que cubre ambos dominios.
    ssl_certificate /etc/letsencrypt/live/cartadragonpai.chickenkiller.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cartadragonpai.chickenkiller.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /admin-static/ {
        alias /site/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
