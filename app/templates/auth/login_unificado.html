{% extends "base.html" %}

{% block title %}Iniciar sesión - La Carta 2.0{% endblock %}

{% block content %}
<h2>Iniciar sesión</h2>

<form id="form-login-local">
    <label for="username">Usuario</label>
    <input id="username" name="username"
           type="text" required minlength="3"
           autocomplete="username">

    <label for="password">Contraseña</label>
    <input id="password" name="password"
           type="password" required minlength="8"
           autocomplete="current-password">

    <button type="submit">Iniciar sesión con JWT</button>
    <button type="button" id="btn-registro">
        Crear cuenta
    </button>
</form>

<p id="mensaje-login" role="status"></p>

<hr>

<a href="{{ url_for('auth.login') }}">
    Continuar con Auth0
</a>

<script src="{{ url_for('static', filename='js/login_local.js') }}"></script>
{% endblock %}
