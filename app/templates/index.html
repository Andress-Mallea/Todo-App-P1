{% extends "base.html" %}

{% block title %}My Todos{% endblock %}

{% block content %}
    
    <section id="auth-view" class="card auth-card" hidden>
        <h2>Sign in</h2>
        <p>Auth0 muestra el inicio de sesión y el registro, y te devuelve aquí.</p>
        <button type="button" id="login" class="btn btn-primary">Sign in with Auth0</button>
    </section>

    <div id="todos-view" hidden>
        <section class="card">
            <h2>Add a todo</h2>
            <form id="create-form" class="todo-form">
                <input type="text" name="title" placeholder="What needs to be done?" required maxlength="200">
                <textarea name="description" placeholder="Optional details" rows="2"></textarea>
                <button type="submit" class="btn btn-primary">Add</button>
            </form>
        </section>

        <section class="card">
            <h2>Todos <span id="count" class="count"></span></h2>
            <ul id="todo-list" class="todo-list"></ul>
            <p id="empty" class="empty" hidden>No todos yet. Add one above.</p>
        </section>
    </div>
{% endblock %}

{% block scripts %}
    <script>window.AUTH0 = {{ auth0_config|tojson }};</script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% endblock %}
