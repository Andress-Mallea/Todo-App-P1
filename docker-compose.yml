
services:
  # 1. Base de Datos
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123qwe}
      - POSTGRES_DB=${POSTGRES_DB:-movies_database}
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-movies_database}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Tu aplicación Flask (API/Portafolio con JWT)
  web:
    build: .
    container_name: flask_app
    restart: always
    environment:
      - SECRET_KEY=${SECRET_KEY:-clave-secreta-de-desarrollo}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-change-me-32-bytes-min}
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES:-60}
      - JWT_ISSUER=${JWT_ISSUER:-flask-movies-app}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://app:123qwe@db:5432/movies_database}
      - FLASK_APP=${FLASK_APP:-wsgi.py}
    volumes:
      - ./migrations:/site/migrations
    command: ["gunicorn", "--preload", "--config", "gunicorn.conf.py", "--bind", "0.0.0.0:8000", "wsgi:app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # 3. Tu panel administrador de Django
  admin_django:
    build: .
    container_name: django_app
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-movies_database}
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123qwe}
      - DB_HOST=${DB_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@ejemplo.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-supersecreto123}
    entrypoint: ""
    command: ["sh", "-c", "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py createsuperuser --noinput || true && gunicorn --config gunicorn.conf.py --bind 0.0.0.0:8080 config.wsgi:application"]
    volumes:
      - static_files:/site/staticfiles
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

  # 4. El servidor Nginx (Proxy Inverso y archivos estáticos)
  nginx:
    image: nginx:1.25.3
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/site/staticfiles:ro
    depends_on:
      - web
      - admin_django

volumes:
  datos_pg:
  static_files:
  