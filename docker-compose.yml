services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    entrypoint: ["sh", "-c"]
    command: ["python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    environment: &django_env
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      DB_HOST: db
      POSTGRES_PORT: '5432'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - static_files:/site/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  admin_django:
    build: .
    entrypoint: []
    command: ["gunicorn", "--config", "gunicorn.conf.py", "--bind", "0.0.0.0:8080", "config.wsgi:application"]
    restart: unless-stopped
    environment: *django_env
    volumes:
      - static_files:/site/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Define AUTH0_DOMAIN en .env}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Define AUTH0_AUDIENCE en .env}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?Define AUTH0_CLIENT_ID en .env}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    command: ["gunicorn", "--config", "gunicorn.conf.py", "--bind", "0.0.0.0:8000", "wsgi:app"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.25.3
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/site/staticfiles:ro
    depends_on:
      - web
      - admin_django

volumes:
  datos_pg:
  static_files:
