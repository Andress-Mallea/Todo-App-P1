# Se combina con docker-compose.yml en EC2.
# El .env de PRODUCCIÓN debe contener NGINX_CONFIG=prod.conf
# y COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
services:
  web:
    environment:
      SESSION_COOKIE_SECURE: "1"
      BEHIND_PROXY: "1"
  migrate:
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "admin.3-90-114-237.sslip.io"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://admin.3-90-114-237.sslip.io"
  admin_django:
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "admin.3-90-114-237.sslip.io"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://admin.3-90-114-237.sslip.io"
  nginx:
    ports:
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
