services:
  web:
    environment:
      SESSION_COOKIE_SECURE: '1'
      BEHIND_PROXY: '1'
  migrate:
    environment:
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: admindragonpai.chickenkiller.com
      DJANGO_CSRF_TRUSTED_ORIGINS: https://admindragonpai.chickenkiller.com
  admin_django:
    environment:
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: admindragonpai.chickenkiller.com
      DJANGO_CSRF_TRUSTED_ORIGINS: https://admindragonpai.chickenkiller.com
  nginx:
    volumes:
    - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
    - 443:443
